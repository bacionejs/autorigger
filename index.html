<script>onload=()=>{
let SCENE=[];
let {min,max,abs,sin,cos,asin,PI}=Math,Pi=PI/2;
let element=(t,p={})=>document.body.appendChild(Object.assign(document.createElement(t),p));
element("style").textContent=`
*{margin:0}
body{background:black}
canvas{width:100dvmin;aspect-ratio:1}
`;

let c=element("canvas",{width:600,height:600}),x=c.getContext("2d"),s=6,o={x:300,y:280};
let slider=element("input",{type:"range",min:"0.2",max:"1",step:"0.1",value:"0.5"});

function autorig(u){
let path=new Path2D();u.forEach(d=>d[2]?path.bezierCurveTo(...d):path.moveTo(...d));
let pt=[],p0={x:u[0][0],y:u[0][1]};
u.forEach(d=>{
  if(d.length===6&&d[2]){
    for(let t=0;t<=1;t+=0.01){
      let m=1-t;
      pt.push({x:m*m*m*p0.x+3*m*m*t*d[0]+3*m*t*t*d[2]+t*t*t*d[4],y:m*m*m*p0.y+3*m*m*t*d[1]+3*m*t*t*d[3]+t*t*t*d[5]});
    }
    p0={x:d[4],y:d[5]};
  }else{p0={x:d[0],y:d[1]};pt.push(p0);}
});
let tm=0,mx=(min(...pt.map(v=>v.x))+max(...pt.map(v=>v.x)))/2,
sx=pt.filter(v=>abs(v.x-mx)<0.4),
sm=(min(...sx.map(v=>v.y))+max(...sx.map(v=>v.y)))/2,
tp=sx.filter(v=>v.y<=sm).reduce((a,b)=>abs(b.x-mx)<abs(a.x-mx)?b:a),
bt=sx.filter(v=>v.y>sm).reduce((a,b)=>abs(b.x-mx)<abs(a.x-mx)?b:a),
th=bt.y-tp.y,my=(tp.y+bt.y)/2,
sy=pt.filter(v=>abs(v.y-my)<0.4),
bi=sy.filter(v=>v.x<mx).reduce((a,b)=>b.x>a.x?b:a),
fi=sy.filter(v=>v.x>mx).reduce((a,b)=>b.x>a.x?b:a),
bx=bi.x+th/2,
fx=fi.x-th/2,
h=(max(...pt.map(v=>v.y))-min(...pt.map(v=>v.y)))*s,
l1=h*0.35,
bw1=th*s*0.8,
bw2=bw1*0.38,
l2=l1*(0.37/0.35),
bw3=bw2*0.5,
l3=l2*0.28,
bw4=bw3*0.8,
bone=(len,w1,w2)=>{let a=asin((w1-w2)/(2*len)),pb=new Path2D();pb.arc(0,0,w1/2,Pi+a,-Pi-a);pb.arc(len,0,w2/2,-Pi-a,Pi+a);return pb;},
foot=(len,w)=>{let pb=new Path2D();pb.moveTo(-len*0.15,-w*0.2);pb.lineTo(len*0.2,-w*0.7);pb.lineTo(len*0.8,-w*1.0);pb.lineTo(len,-w*1.0);pb.lineTo(len,w*0.6);pb.lineTo(len*0.5,w*0.6);pb.lineTo(0,w*0.3);pb.closePath();return pb;},
b1=bone(l1,bw1,bw2),
b2=bone(l2,bw2,bw3),
b3=foot(l3,bw4),
joints=[{x:o.x+bx*s,y:o.y+my*s,ph:5.65},{x:o.x+fx*s,y:o.y+my*s,ph:2.51}],
seg=(dx,dy,a,pb,sc=1)=>{x.save();x.translate(dx,dy);x.scale(sc,sc);x.rotate(a);x.fillStyle="black";x.fill(pb);x.restore();};
return {draw(d){
  tm+=d;
  x.fillStyle="white";
  x.fillRect(0,0,600,600);
  x.save();
  x.translate(0,-abs(sin(tm*8.33))*5);
  seg(o.x,o.y,0,path,s);
  joints.forEach(j=>{
    let lt=tm*16.66+j.ph,
    a1=Pi-sin(lt)*0.85,
    c=cos(lt),
    flexFactor=0.5*(c+Math.sqrt(c*c+0.05)),
    a2=a1+flexFactor*1.4,
    a3=a2+flexFactor*0.8,
    x1=j.x+cos(a1)*l1,y1=j.y+sin(a1)*l1,
    x2=x1+cos(a2)*l2,y2=y1+sin(a2)*l2;
    seg(j.x,j.y,a1,b1);
    seg(x1,y1,a2,b2);
    seg(x2,y2,a3,b3);
  });
  x.restore();
}}}

let leglessunicorn=[
  [1.9,-3.2,0,-1.6,0,-3.1],[2.9,-3.8,1.6,-3.5,1.6,-4.2],[3.9,-4.7,1.5,-4.5,1.6,-5.4],[2.6,-4.9,3.4,-6.7,2.6,-6.4],[3.8,-8.2,5,-6.1,4,-8.3],[5.8,-6.8,5.3,-8.4,6.2,-8.2],[6.5,-7.6,7,-7.6,7.5,-8.5],[7.3,-6.6,7.3,-6.9,9.6,-9.5],[8.4,-7.1,7.7,-6.4,8.2,-6],[8.1,-5.6,9,-4.4,9.1,-3.9],[9.4,-2.1,7.9,-2.2,8,-3.1],[7.5,-3.7,6.7,-3.6,6.5,-4.1],[5.4,-0.2,6,0,0.8,0.7],[-3.5,1.2,-4.4,-1.5,-4.2,-2.3],[-5.7,-2.4,-5.9,1,-7.4,0.7],[-6.6,0.3,-6.3,-0.8,-6.8,-0.2],[-7.5,0.5,-8.7,1.2,-9.6,-1.7],[-9,-0.9,-7.6,-1,-8.4,-1.5],[-8.7,-1.7,-9,-1.9,-8.9,-2.2],[-7.3,-0.5,-6.1,-5.4,-3.8,-3],[-1.7,-4.7,-0.3,-2.5,1.9,-3.2]
];

SCENE.push(autorig(leglessunicorn));

((l,d,p)=>(l=t=>(d=min(.1,(t-p)/1000)||0,p=t,SCENE.forEach(o=>o.draw(d*slider.value)),requestAnimationFrame(l)))())();

}</script>
